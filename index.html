<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="여행준비">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>싱가포르·말레이시아 여행 준비물</title>
  <style>
    :root{
      --bg:#f6f8fb; --card:#fff; --text:#172033; --sub:#728097;
      --line:#e7ebf0; --primary:#0f766e; --secondary:#2563eb;
      --soft:#eefaf7; --warn:#fff7ed; --shadow:0 10px 30px rgba(15,23,42,.08);
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
    body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
    .app{max-width:760px;margin:0 auto}
    .top{
      padding:calc(22px + env(safe-area-inset-top)) 18px 20px;
      color:#fff;background:linear-gradient(135deg,var(--primary),var(--secondary));
      border-radius:0 0 26px 26px;box-shadow:var(--shadow)
    }
    .eyebrow{font-size:13px;opacity:.85;font-weight:700;letter-spacing:.02em}
    h1{font-size:26px;line-height:1.25;margin:6px 0 10px}
    .sub{font-size:14px;opacity:.9;line-height:1.55}
    .progress-wrap{margin-top:18px;background:rgba(255,255,255,.16);border-radius:18px;padding:14px}
    .progress-head{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:700;margin-bottom:9px}
    .pct{font-size:22px}
    .track{height:10px;background:rgba(255,255,255,.25);border-radius:999px;overflow:hidden}
    .bar{height:100%;width:0;background:#fff;border-radius:999px;transition:.25s}
    .content{padding:16px}
    .notice{
      background:var(--soft);border:1px solid #cdeee7;border-radius:17px;padding:14px 15px;
      font-size:13px;line-height:1.6;margin-bottom:14px
    }
    .tools{display:grid;grid-template-columns:1fr auto;gap:9px;margin-bottom:14px}
    input[type=search],input[type=text],select{
      width:100%;border:1px solid var(--line);background:#fff;border-radius:14px;
      padding:13px 14px;font-size:15px;outline:none;color:var(--text)
    }
    input:focus,select:focus{border-color:#76a7ff;box-shadow:0 0 0 3px rgba(37,99,235,.11)}
    button{
      border:1px solid var(--line);background:#fff;color:var(--text);border-radius:14px;
      padding:11px 14px;font-weight:800;font-size:14px;cursor:pointer
    }
    .primary{background:var(--primary);border-color:var(--primary);color:#fff}
    .cards{display:grid;gap:12px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
    .card-head{display:flex;justify-content:space-between;align-items:center;padding:15px 16px;border-bottom:1px solid var(--line)}
    .card-title{font-size:17px;font-weight:900}
    .card-count{font-size:12px;color:var(--sub);font-weight:800}
    .item{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:13px 14px;border-bottom:1px dashed var(--line)}
    .item:last-child{border-bottom:0}
    .item input[type=checkbox]{width:21px;height:21px;accent-color:var(--primary)}
    .name{font-size:15px;font-weight:800}
    .meta{font-size:12px;color:var(--sub);margin-top:3px;line-height:1.4}
    .item.done .name{text-decoration:line-through;color:#a1a8b4}
    .tag{font-size:11px;font-weight:800;border-radius:999px;padding:5px 8px;background:#eef2ff;color:#3b4cca;white-space:nowrap}
    .add{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px;margin-top:14px;box-shadow:var(--shadow)}
    .add h2{font-size:17px;margin:0 0 10px}
    .add-grid{display:grid;grid-template-columns:1fr;gap:8px}
    .bottom{
      position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);
      backdrop-filter:blur(12px);border-top:1px solid var(--line);
      padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:10
    }
    .bottom-inner{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
    .bottom button{padding:10px 8px;font-size:12px}
    .empty{text-align:center;padding:28px;color:var(--sub)}
    .install-banner{
      display:none;margin:14px 16px 0;background:#fff;border:1px solid var(--line);
      border-radius:16px;padding:13px 14px;box-shadow:var(--shadow)
    }
    .install-banner.show{display:flex;justify-content:space-between;align-items:center;gap:10px}
    .install-text{font-size:13px;line-height:1.45}
    @media(min-width:600px){
      .add-grid{grid-template-columns:1fr 190px auto}
      .top{margin-top:18px;border-radius:26px}
      .app{padding:0 12px}
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="top">
      <div class="eyebrow">5박 7일 · Singapore + Malaysia</div>
      <h1>🧳 여행 준비물 체크</h1>
      <div class="sub">체크한 내용은 이 기기에 자동 저장됩니다. 인터넷이 끊겨도 마지막에 열었던 앱 화면을 계속 사용할 수 있습니다.</div>
      <div class="progress-wrap">
        <div class="progress-head">
          <span id="summary">0 / 0개 준비 완료</span>
          <span class="pct" id="pct">0%</span>
        </div>
        <div class="track"><div class="bar" id="bar"></div></div>
      </div>
    </section>

    <div class="install-banner" id="installBanner">
      <div class="install-text"><strong>📱 홈 화면에 설치</strong><br>브라우저 메뉴를 열지 않고 앱처럼 실행할 수 있어요.</div>
      <button class="primary" id="installBtn">설치</button>
    </div>

    <section class="content">
      <div class="notice">
        🌴 <strong>여행 메모</strong><br>
        싱가포르와 말레이시아는 덥고 습한 날씨가 많으므로 얇은 옷, 편한 신발, 우산·우비를 준비하세요.
        여권·항공권·숙소·입국 관련 정보는 출발 직전 최신 안내를 다시 확인하세요.
      </div>

      <div class="tools">
        <input id="search" type="search" placeholder="준비물 검색">
        <button id="pendingBtn">미완료만</button>
      </div>

      <section id="cards" class="cards"></section>

      <section class="add">
        <h2>➕ 준비물 직접 추가</h2>
        <div class="add-grid">
          <input id="newItem" type="text" placeholder="예: 선글라스">
          <select id="newCategory"></select>
          <button class="primary" id="addBtn">추가</button>
        </div>
      </section>
    </section>
  </main>

  <nav class="bottom">
    <div class="bottom-inner">
      <button id="allBtn">✓ 전체 체크</button>
      <button id="copyBtn">📋 목록 복사</button>
      <button id="resetBtn">↺ 체크 초기화</button>
    </div>
  </nav>

<script>
const KEY = "sgmy_pwa_pack_v2";

const baseData = [
  ["📄 서류·예약",[
    ["여권","유효기간 확인","필수"],["항공권·탑승권","앱 또는 PDF 저장","필수"],
    ["호텔 예약 확인서","오프라인 저장 권장","필수"],["여행자보험 정보","가입한 경우","권장"],
    ["입국·여행 관련 확인자료","출발 직전 최신 안내 확인","확인"],["여권 사본·증명사진","분실 대비","권장"]
  ]],
  ["👕 의류",[
    ["반팔 상의","5~6장","5박7일"],["얇은 하의","3~4벌","추천"],["속옷","6~7세트","5박7일"],
    ["양말","4~6켤레","추천"],["잠옷","1벌","추천"],["얇은 겉옷","실내 냉방 대비","추천"],
    ["모자","강한 햇빛 대비","추천"],["수영복","호텔 수영장 이용 시","선택"]
  ]],
  ["👟 신발·가방",[
    ["편한 운동화","도보 이동용","추천"],["샌들 또는 슬리퍼","비·수영장 대비","추천"],
    ["작은 크로스백","여권·휴대폰 보관","추천"],["접이식 보조가방","쇼핑·귀국 짐 증가 대비","추천"]
  ]],
  ["🧴 세면·위생",[
    ["칫솔·치약","","기본"],["세안용품","","기본"],["기초 화장품","소용량 권장","기본"],
    ["선크림","야외 활동 대비","추천"],["휴대용 티슈·물티슈","","추천"],["손 소독제","소용량","선택"],
    ["빗·면도용품 등","개인 필요에 따라","선택"]
  ]],
  ["🌧️ 날씨 대비",[
    ["접이식 우산","갑작스러운 비 대비","추천"],["얇은 우비","야외 일정이 많다면","선택"],
    ["작은 수건","땀·비 대비","추천"],["지퍼백·방수 파우치","전자기기·젖은 물품 보관","추천"]
  ]],
  ["🔌 전자기기",[
    ["휴대폰","","필수"],["휴대폰 충전기","","필수"],["보조배터리","항공사 반입 규정 확인","추천"],
    ["멀티 충전 케이블","","추천"],["여행용 어댑터","숙소 콘센트 형태 확인","추천"],
    ["이어폰","","선택"],["카메라","사용하는 경우","선택"]
  ]],
  ["💳 돈·결제",[
    ["해외 결제 가능 카드","해외사용 설정 확인","필수"],["소액 현금","교통·소규모 결제 대비","추천"],
    ["예비 카드","분실 대비 별도 보관","권장"],["환전 내역 메모","필요 시","선택"]
  ]],
  ["💊 건강·개인용품",[
    ["개인 복용약","필요한 경우","필수"],["기본 상비용품","개인에게 필요한 범위","권장"],
    ["안경·렌즈","사용하는 경우","필수"],["마스크","필요 시","선택"]
  ]],
  ["🎒 기내·이동",[
    ["목베개","장거리 이동 시","선택"],["가벼운 겉옷","기내 냉방 대비","추천"],
    ["빈 물병","보안검색 후 사용","선택"],["볼펜","서류 작성 대비","추천"],
    ["간단한 간식","필요 시","선택"]
  ]]
];

function fresh(){
  let n=0;
  return baseData.map(([category,items])=>({
    category,
    items:items.map(([name,meta,tag])=>({id:"i"+(++n),name,meta,tag,done:false,custom:false}))
  }));
}
function load(){
  try{
    const v=JSON.parse(localStorage.getItem(KEY));
    if(Array.isArray(v)) return v;
  }catch(e){}
  return fresh();
}
let state=load();
let pending=false;
let deferredPrompt=null;

function save(){ localStorage.setItem(KEY,JSON.stringify(state)); }
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]));}

function render(){
  const q=document.getElementById("search").value.trim().toLowerCase();
  const root=document.getElementById("cards");
  root.innerHTML="";
  let any=false;

  state.forEach((g,gi)=>{
    const items=g.items.filter(i=>{
      const hit=(i.name+" "+i.meta+" "+i.tag).toLowerCase().includes(q);
      return hit && (!pending || !i.done);
    });
    if(!items.length) return;
    any=true;

    const doneCount=g.items.filter(i=>i.done).length;
    const card=document.createElement("article");
    card.className="card";
    card.innerHTML=`<div class="card-head">
      <div class="card-title">${esc(g.category)}</div>
      <div class="card-count">${doneCount}/${g.items.length}</div>
    </div><div class="list"></div>`;

    const list=card.querySelector(".list");
    items.forEach(item=>{
      const row=document.createElement("label");
      row.className="item"+(item.done?" done":"");
      row.innerHTML=`
        <input type="checkbox" data-id="${item.id}" ${item.done?"checked":""}>
        <div><div class="name">${esc(item.name)}</div>${item.meta?`<div class="meta">${esc(item.meta)}</div>`:""}</div>
        <span class="tag">${esc(item.tag||"추가")}</span>`;
      list.appendChild(row);
    });
    root.appendChild(card);
  });

  if(!any) root.innerHTML='<div class="card empty">조건에 맞는 준비물이 없습니다.</div>';

  root.querySelectorAll("input[type=checkbox]").forEach(chk=>{
    chk.onchange=e=>{
      const id=e.target.dataset.id;
      state.forEach(g=>g.items.forEach(i=>{if(i.id===id)i.done=e.target.checked;}));
      save();render();
    };
  });

  const all=state.flatMap(g=>g.items);
  const done=all.filter(i=>i.done).length;
  const pct=all.length?Math.round(done/all.length*100):0;
  document.getElementById("summary").textContent=`${done} / ${all.length}개 준비 완료`;
  document.getElementById("pct").textContent=pct+"%";
  document.getElementById("bar").style.width=pct+"%";

  const sel=document.getElementById("newCategory");
  const cur=sel.value;
  sel.innerHTML=state.map((g,i)=>`<option value="${i}">${esc(g.category)}</option>`).join("");
  if(cur) sel.value=cur;
}

document.getElementById("search").oninput=render;
document.getElementById("pendingBtn").onclick=e=>{
  pending=!pending;e.target.textContent=pending?"전체 보기":"미완료만";render();
};
document.getElementById("allBtn").onclick=()=>{
  const all=state.flatMap(g=>g.items); const target=!all.every(i=>i.done);
  state.forEach(g=>g.items.forEach(i=>i.done=target)); save();render();
};
document.getElementById("addBtn").onclick=()=>{
  const input=document.getElementById("newItem"), name=input.value.trim();
  if(!name) return;
  const gi=Number(document.getElementById("newCategory").value);
  state[gi].items.push({id:"c"+Date.now(),name,meta:"직접 추가",tag:"사용자",done:false,custom:true});
  input.value="";save();render();
};
document.getElementById("newItem").onkeydown=e=>{if(e.key==="Enter")document.getElementById("addBtn").click();};
document.getElementById("resetBtn").onclick=()=>{
  if(confirm("모든 체크 표시를 초기화할까요? 직접 추가한 항목은 유지됩니다.")){
    state.forEach(g=>g.items.forEach(i=>i.done=false));save();render();
  }
};
document.getElementById("copyBtn").onclick=async()=>{
  const lines=["싱가포르·말레이시아 5박 7일 여행 준비물",""];
  state.forEach(g=>{
    lines.push(g.category);
    g.items.forEach(i=>lines.push(`${i.done?"✅":"⬜"} ${i.name}${i.meta?" - "+i.meta:""}`));
    lines.push("");
  });
  try{await navigator.clipboard.writeText(lines.join("\n"));alert("준비물 목록을 복사했습니다.");}
  catch(e){alert("브라우저에서 복사를 허용하지 않았습니다.");}
};

window.addEventListener("beforeinstallprompt",e=>{
  e.preventDefault();deferredPrompt=e;
  document.getElementById("installBanner").classList.add("show");
});
document.getElementById("installBtn").onclick=async()=>{
  if(!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt=null;
  document.getElementById("installBanner").classList.remove("show");
};

if("serviceWorker" in navigator){
  window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js"));
}
render();
</script>
</body>
</html>
